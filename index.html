<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>河口湖拍照景點地圖</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6f8;color:#203342;font-family:system-ui,-apple-system,"Microsoft JhengHei",sans-serif}
main{max-width:1100px;margin:auto;padding:18px}
header{margin-bottom:14px}
h1{font-size:24px;margin:0 0 8px}
header p{font-size:14px;margin:0;color:#5c6d79;line-height:1.7}
.toolbar{display:flex;gap:8px;align-items:center;margin:12px 0;flex-wrap:wrap}
button,.maplink{font:inherit}
.reset{background:#fff;border:1px solid #cbd5df;border-radius:8px;padding:8px 14px;cursor:pointer;color:#244759}
#map{height:480px;width:100%;border-radius:14px;background:#dfe9ed;z-index:0}
.status{font-size:12px;color:#647885}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.card{background:#fff;padding:14px;border:1px solid #e1e8ed;border-radius:12px;display:flex;gap:12px;align-items:flex-start}
.badge{width:30px;height:30px;flex-shrink:0;background:#167c80;color:white;border-radius:50%;display:grid;place-items:center;font-weight:700}
.card.extra .badge{background:#956342}
.title{background:none;border:0;padding:0;text-align:left;font-size:16px;font-weight:700;color:#203342;cursor:pointer}
.title:hover{text-decoration:underline}
.desc{font-size:13px;color:#637481;margin:5px 0 9px;line-height:1.5}
.maplink{font-size:13px;color:#087e87;text-decoration:none}
.maplink:hover{text-decoration:underline}
.marker{border:3px solid white;border-radius:50%;background:#167c80;color:#fff;box-shadow:0 2px 7px #0005;display:grid;place-items:center;font-weight:bold;font-size:15px}
.marker.extra{background:#956342}
.popup-title{font-weight:700;font-size:15px;margin-bottom:7px}
.popup-note{line-height:1.6;margin-bottom:9px}
.footnote{font-size:12px;line-height:1.8;color:#637481;margin-top:13px}
@media(max-width:600px){
main{padding:12px}
h1{font-size:21px}
#map{height:390px}
.grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<main>
<header>
<h1>河口湖・7 個拍照景點</h1>
<p>拖曳或縮放地圖探索位置。點選編號或景點名稱，可查看標記。</p>
</header>
<div class="toolbar">
<button class="reset" id="reset">顯示全部景點</button>
<span class="status" id="status" role="status">正在載入地圖；下方景點連結可直接使用。</span>
</div>
<div id="map" aria-label="河口湖拍照景點互動地圖"></div>
<div class="grid" id="list"></div>
<p class="footnote">
綠色：河口湖周邊景點｜棕色：富士吉田市景點。<br>
標記為概略位置，並非精確入口、停車場或拍攝站位。④為纜車山腳乘車處；⑦為忠靈塔附近，並非可開車直達的目的地。<br>
若底圖空白，可能是外部圖資被預覽環境限制；請使用各景點的 Google 地圖連結。
</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const places=[
{id:1,name:"大石公園",jp:"大石公園 河口湖",lat:35.52306,lng:138.74615,note:"花卉、湖景與富士山構圖。"},
{id:2,name:"產屋崎（產屋ヶ崎）",jp:"産屋ヶ崎 河口湖",lat:35.5147,lng:138.7697,note:"湖畔富士山取景點。"},
{id:3,name:"長崎公園",jp:"長崎公園 河口湖",lat:35.52116,lng:138.75746,note:"北岸岬角的自然湖景。"},
{id:4,name:"富士山全景纜車",jp:"河口湖 富士山パノラマロープウェイ 河口湖畔駅",lat:35.5038,lng:138.7729,note:"此處標示山腳乘車處；展望台需上山。"},
{id:5,name:"紅葉迴廊",jp:"河口湖 もみじ回廊",lat:35.5265,lng:138.7618,note:"梨川沿線的紅葉散策區。"},
{id:6,name:"音樂與森林美術館",jp:"河口湖 音楽と森の美術館",lat:35.52242,lng:138.76871,note:"庭園與建築取景。"},
{id:7,name:"新倉山淺間公園",jp:"新倉山浅間公園 忠霊塔",lat:35.5012,lng:138.8014,note:"位於富士吉田市，標示忠靈塔附近；需步行上山。",extra:true}
];
const link=p=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p.jp);
let map=null;
const markers={};
const list=document.getElementById("list");
places.forEach(p=>{
const card=document.createElement("article");
card.className="card"+(p.extra?" extra":"");
card.innerHTML=`<span class="badge">${p.id}</span><div><button class="title">${p.name}</button><p class="desc">${p.note}</p><a class="maplink" href="${link(p)}" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟 ↗</a></div>`;
card.querySelector("button").onclick=()=>{
if(map&&markers[p.id]){
map.setView([p.lat,p.lng],15);
markers[p.id].openPopup();
document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"});
}else{
document.getElementById("status").textContent="互動地圖未能載入，請使用「在 Google 地圖開啟」。";
}
};
list.appendChild(card);
});
const status=document.getElementById("status");
if(typeof L!=="undefined"){
map=L.map("map",{scrollWheelZoom:false}).setView([35.516,138.77],13);
const tiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
maxZoom:19,
attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
}).addTo(map);
tiles.on("load",()=>{status.textContent="可拖曳地圖，使用 ＋／－ 縮放。";});
tiles.on("tileerror",()=>{status.textContent="部分底圖無法載入；景點清單與 Google 地圖連結仍可使用。";});
places.forEach(p=>{
const icon=L.divIcon({
className:"marker"+(p.extra?" extra":""),
html:String(p.id),iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-17]
});
markers[p.id]=L.marker([p.lat,p.lng],{icon,title:p.name}).addTo(map)
.bindPopup(`<div class="popup-title">${p.id}. ${p.name}</div><div class="popup-note">${p.note}</div><a href="${link(p)}" target="_blank" rel="noopener noreferrer">在 Google 地圖開啟 ↗</a>`);
});
const bounds=L.latLngBounds(places.map(p=>[p.lat,p.lng]));
function showAll(){map.fitBounds(bounds,{padding:[35,35]});}
document.getElementById("reset").onclick=showAll;
showAll();
}else{
status.textContent="互動地圖未能載入，請使用下方 Google 地圖連結。";
document.getElementById("map").style.display="none";
document.getElementById("reset").disabled=true;
}
</script>
</body>
</html>
